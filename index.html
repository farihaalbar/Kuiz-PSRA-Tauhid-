<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LATIH TUBI PSRA - AKIDAH (20 SOALAN)</title>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #a8ff78 0%, #78ffd6 100%);
            --card-bg: #ffffff;
            --primary: #ff4757;
            --accent-yellow: #ffa502;
            --accent-purple: #8e44ad;
            --accent-green: #2ed573;
            --accent-blue: #1e90ff;
            --text-dark: #2f3542;
            --shadow: 0 15px 35px rgba(0,0,0,0.15);
        }

        body {
            font-family: 'Traditional Arabic', 'Amiri', 'Comic Sans MS', sans-serif;
            background: var(--bg-gradient);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        #game-container {
            background-color: var(--card-bg);
            width: 90%;
            max-width: 550px;
            padding: 22px;
            border-radius: 30px;
            box-shadow: var(--shadow);
            text-align: center;
            position: relative;
            border: 6px solid #ffffff;
            outline: 4px dashed var(--accent-purple);
        }

        .title-tag {
            font-size: 1.3rem;
            font-weight: 900;
            color: var(--accent-purple);
            margin-bottom: 8px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 1.1rem;
            font-weight: 900;
            color: var(--text-dark);
            margin-bottom: 12px;
            background: #fff0f5;
            padding: 8px 15px;
            border-radius: 20px;
            border: 2px solid #ff4757;
            direction: rtl;
        }

        .question-box {
            background: linear-gradient(135deg, #6c5ce7, #a29bfe);
            color: white;
            padding: 15px;
            border-radius: 20px;
            font-size: 1.35rem;
            font-weight: bold;
            margin-bottom: 15px;
            min-height: 70px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 5px 15px rgba(108, 92, 231, 0.3);
            direction: rtl;
            line-height: 1.6;
        }

        /* MCQ Grid */
        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            direction: rtl;
        }

        .option-btn {
            background-color: #ffffff;
            border: 3px solid #dfe6e9;
            border-bottom: 5px solid #b2bec3;
            border-radius: 18px;
            padding: 10px 8px;
            font-size: 1.15rem;
            font-family: 'Traditional Arabic', 'Amiri', serif;
            font-weight: 900;
            color: var(--text-dark);
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .option-btn.correct {
            background-color: var(--accent-green) !important;
            border-color: #26af5f !important;
            color: white !important;
        }

        .option-btn.wrong {
            background-color: var(--primary) !important;
            border-color: #d63031 !important;
            color: white !important;
        }

        /* Drag and Drop Layout */
        .drag-section {
            display: flex;
            flex-direction: column;
            gap: 10px;
            direction: rtl;
        }

        .drag-bank {
            display: flex;
            justify-content: center;
            gap: 8px;
            flex-wrap: wrap;
            background: #eef5ff;
            padding: 10px;
            border-radius: 15px;
            border: 2px dashed var(--accent-blue);
            min-height: 45px;
        }

        .drag-item {
            background: var(--accent-purple);
            color: white;
            padding: 6px 14px;
            border-radius: 12px;
            font-size: 1.1rem;
            font-family: 'Traditional Arabic', 'Amiri', serif;
            font-weight: bold;
            cursor: grab;
            user-select: none;
            box-shadow: 0 3px 6px rgba(0,0,0,0.1);
        }

        .drop-targets {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 280px;
            overflow-y: auto;
        }

        .drop-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #f1f2f6;
            padding: 8px 12px;
            border-radius: 12px;
            text-align: right;
        }

        .target-label {
            font-size: 1.05rem;
            font-weight: bold;
            color: var(--text-dark);
            width: 60%;
        }

        .drop-zone {
            width: 35%;
            height: 38px;
            border: 2px dashed #b2bec3;
            border-radius: 10px;
            background: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.05rem;
            font-weight: bold;
            color: var(--accent-blue);
        }

        .drop-zone.hovered { background: #ffeaa7; }
        .drop-zone.filled {
            border: 2px solid var(--accent-green);
            background: #55efc4;
            color: #2d3436;
        }

        .btn-check-drag {
            background: var(--accent-yellow);
            color: var(--text-dark);
            border: none;
            padding: 10px 20px;
            font-size: 1.1rem;
            font-family: 'Traditional Arabic', 'Amiri', serif;
            font-weight: bold;
            border-radius: 20px;
            cursor: pointer;
            margin-top: 5px;
        }

        #end-screen {
            display: none;
            flex-direction: column;
            align-items: center;
        }

        .btn-restart {
            background: linear-gradient(135deg, var(--accent-green), #10ac84);
            color: white;
            border: none;
            padding: 12px 28px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            margin-top: 15px;
        }

        canvas {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
        }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="confetti-canvas"></canvas>

    <div id="quiz-screen">
        <div class="title-tag">✨ التيه توبي PSRA - عقيدة / توحيد ✨</div>

        <div class="header">
            <span id="question-number">📌 سؤالن 1/20</span>
            <span id="score-display">⭐ ماركه: 0</span>
        </div>

        <div class="question-box">
            <div id="question-text">Loading...</div>
        </div>

        <div id="interaction-container"></div>
    </div>

    <div id="end-screen">
        <h1 style="font-size: 2.2rem; margin: 0; color: var(--accent-purple);">🎉 ممتاز يا ياسمين! 🎉</h1>
        <p id="final-score" style="font-size: 1.4rem; font-weight: bold; color: var(--text-dark);"></p>
        <button class="btn-restart" onclick="startGame()">أولڠ لاتيهن 🔄</button>
    </div>
</div>

<script>
    // BANK 20 SOALAN AKIDAH / TAUHID (JAWI SEPENUHNYA)
    const activeQuestions = [
        // 10 SOALAN OBJEKTIF (MCQ)
        {
            type: "mcq",
            q: "اڤاكه حكوم برإيمان كڤد هاري قيامة باݢي سأيڤوق مسلم؟",
            options: ["سنة", "واجب", "هاروس", "مکروه"],
            answer: "واجب"
        },
        {
            type: "mcq",
            q: "صفة 'وحدانية' باݢي الله SWT برمقصود الله مها...",
            options: ["اسا / توڠݢل", "کواسا", "مندرڠر", "مڠتاهوي"],
            answer: "اسا / توڠݢل"
        },
        {
            type: "mcq",
            q: "انتارا بريکوت، يڠ مانيکاه برتقسيمکن شرک جلي؟",
            options: ["معتقدکن اد الٰه صلا؞ين اَللّهُ", "رياء دالم عباده", "عجب دڠن أملن", "سومعة"],
            answer: "معتقدکن اد الٰه صلا؞ين اَللّهُ"
        },
        {
            type: "mcq",
            q: "اڤاكه يڠ دمقصودكن دڠن خرافة؟",
            options: ["کڤرچايا؞ن کاروت يڠ مڽليويڠ", "عملن سنة", "عباده واجب", "حکمة الٰهي"],
            answer: "کڤرچايا؞ن کاروت يڠ مڽليويڠ"
        },
        {
            type: "mcq",
            q: "مڽاماکن الله دڠن مخلوق دسبوت سباݢي...",
            options: ["تشبيه", "مخالفة", "وحدانية", "قيامه بنفسه"],
            answer: "تشبيه"
        },
        {
            type: "mcq",
            q: "صفة 'الحسيب' bagi الله برمقصود الله مها...",
            options: ["مڠحيسب / مڠهيتوڠ", "مڽمڤورناکن", "ممليهارا", "ممليهارا عادل"],
            answer: "مڠحيسب / مڠهيتوڠ"
        },
        {
            type: "mcq",
            q: "ڤركارا غا؞يب يڠ هاڽ بوليه دكتاهوي ملالو؞ي القرءان دان الحديث دسبوت...",
            options: ["سمعيات", "نبويات", "إلهيات", "كونيات"],
            answer: "سمعيات"
        },
        {
            type: "mcq",
            q: "عملن برباواة با؞يق سباب ناك تونجوق كڤد اورڠ لا؞ين دسبوت...",
            options: ["رياء", "عجب", "تكبر", "شرك جلي"],
            answer: "رياء"
        },
        {
            type: "mcq",
            q: "اڤاكه حكوم ميقيني كوجودن توهن صلا؞ين الله؟",
            options: ["شرك", "كفور", "نفاق", "فسق"],
            answer: "شرك"
        },
        {
            type: "mcq",
            q: "تيمباڠن أملن دأخرة كلق دسبوت سباݢي...",
            options: ["الميزان", "الصراط", "المحشر", "الجامع"],
            answer: "الميزان"
        },

        // 10 SOALAN ISI TEMPAT KOSONG (DRAG & DROP - 2 SET)
        {
            type: "drag",
            q: "ايسي تمڤت کوسوڠ برکاءيتن رکن إيمان دان سمعيات (SET 1):",
            pairs: [
                { ms: "ملائکة مڽوال دالم قبور", ans: "منکر & نکير" },
                { ms: "کتاب يڠ دتورونکن كڤد نبي عيسى a.s.", ans: "إنجيل" },
                { ms: "قضاء دان قدر أيداله رکن إيمان ك-", ans: "انم" },
                { ms: "ممڤرچاياءي هاري أخرة أيداله رکن إيمان ك-", ans: "ليما" },
                { ms: "بلاسن با؞يق دأخرة كلق أيداله", ans: "سيورݢ" }
            ]
        },
        {
            type: "drag",
            q: "ايسي تمڤت کوسوڠ برکاءيتن صفة الله دان عقيدة (SET 2):",
            pairs: [
                { ms: "الله مها مندرڠر اياله صفة", ans: "السمع" },
                { ms: "الله مها مليهت اياله صفة", ans: "البصر" },
                { ms: "مڠاكو إسلام تابي هاتي كافير", ans: "نفاق" },
                { ms: "تيمباڠن أملن با؞يق دان چاهت", ans: "الميزان" },
                { ms: "تيمبات ڤرهيمڤونن مأنسي دأخرة", ans: "المحشر" }
            ]
        }
    ];

    let currentQuestionIndex = 0;
    let score = 0;
    let dragAnswers = {};

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playSound(type) {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        if (type === 'correct') {
            const notes = [523.25, 659.25, 783.99, 1046.50];
            notes.forEach((freq, idx) => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime + idx * 0.07);
                gain.gain.setValueAtTime(0.15, audioCtx.currentTime + idx * 0.07);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + idx * 0.07 + 0.2);
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(audioCtx.currentTime + idx * 0.07);
                osc.stop(audioCtx.currentTime + idx * 0.07 + 0.2);
            });
        } else {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(160, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(); osc.stop(audioCtx.currentTime + 0.25);
        }
    }

    function startGame() {
        currentQuestionIndex = 0;
        score = 0;
        document.getElementById('score-display').textContent = `⭐ ماركه: ${score}`;
        document.getElementById('quiz-screen').style.display = 'block';
        document.getElementById('end-screen').style.display = 'none';
        loadQuestion();
    }

    function loadQuestion() {
        const q = activeQuestions[currentQuestionIndex];
        document.getElementById('question-number').textContent = `📌 سؤالن ${currentQuestionIndex + 1}/${activeQuestions.length}`;
        document.getElementById('question-text').innerHTML = q.q;

        const container = document.getElementById('interaction-container');
        container.innerHTML = '';

        if (q.type === 'mcq') {
            const grid = document.createElement('div');
            grid.classList.add('options-grid');
            
            // Susun Pilihan Jawapan Secara Rawak (Terabur)
            const shuffledOptions = [...q.options].sort(() => Math.random() - 0.5);

            shuffledOptions.forEach(opt => {
                const btn = document.createElement('button');
                btn.classList.add('option-btn');
                btn.textContent = opt;
                btn.onclick = () => checkMCQ(btn, opt);
                grid.appendChild(btn);
            });
            container.appendChild(grid);
        } else if (q.type === 'drag') {
            dragAnswers = {};
            const dragSection = document.createElement('div');
            dragSection.classList.add('drag-section');

            // Bank Jawapan Acak
            const bankContainer = document.createElement('div');
            bankContainer.classList.add('drag-bank');
            const shuffledAnswers = q.pairs.map(p => p.ans).sort(() => Math.random() - 0.5);

            shuffledAnswers.forEach((ansText, idx) => {
                const dragElem = document.createElement('div');
                dragElem.classList.add('drag-item');
                dragElem.textContent = ansText;
                dragElem.draggable = true;
                dragElem.id = `drag-${idx}`;
                dragElem.ondragstart = (e) => e.dataTransfer.setData("text", ansText);
                bankContainer.appendChild(dragElem);
            });

            // Target Drop
            const dropTargets = document.createElement('div');
            dropTargets.classList.add('drop-targets');

            q.pairs.forEach(pair => {
                const row = document.createElement('div');
                row.classList.add('drop-row');

                const label = document.createElement('span');
                label.classList.add('target-label');
                label.textContent = pair.ms;

                const dropElem = document.createElement('div');
                dropElem.classList.add('drop-zone');
                dropElem.textContent = "ايسي سينى";
                dropElem.dataset.ms = pair.ms;

                dropElem.ondragover = (e) => { e.preventDefault(); dropElem.classList.add('hovered'); };
                dropElem.ondragleave = () => dropElem.classList.remove('hovered');
                dropElem.ondrop = (e) => {
                    e.preventDefault();
                    dropElem.classList.remove('hovered');
                    const text = e.dataTransfer.getData("text");
                    dropElem.textContent = text;
                    dropElem.classList.add('filled');
                    dragAnswers[pair.ms] = text;
                };

                row.appendChild(label);
                row.appendChild(dropElem);
                dropTargets.appendChild(row);
            });

            dragSection.appendChild(bankContainer);
            dragSection.appendChild(dropTargets);

            const checkBtn = document.createElement('button');
            checkBtn.classList.add('btn-check-drag');
            checkBtn.textContent = "سيماق جوائن 🎯";
            checkBtn.onclick = () => checkDrag(q.pairs);
            dragSection.appendChild(checkBtn);

            container.appendChild(dragSection);
        }
    }

    function checkMCQ(selectedBtn, selectedOpt) {
        const currentAnswer = activeQuestions[currentQuestionIndex].answer;
        const allBtns = document.querySelectorAll('.option-btn');
        allBtns.forEach(b => b.disabled = true);

        if (selectedOpt === currentAnswer) {
            playSound('correct');
            selectedBtn.classList.add('correct');
            score += 5;
            document.getElementById('score-display').textContent = `⭐ ماركه: ${score}`;
        } else {
            playSound('wrong');
            selectedBtn.classList.add('wrong');
            allBtns.forEach(b => {
                if (b.textContent === currentAnswer) b.classList.add('correct');
            });
        }

        setTimeout(() => {
            currentQuestionIndex++;
            if (currentQuestionIndex < activeQuestions.length) loadQuestion();
            else showEndScreen();
        }, 1300);
    }

    function checkDrag(correctPairs) {
        let allCorrect = true;
        correctPairs.forEach(pair => {
            if (dragAnswers[pair.ms] !== pair.ans) {
                allCorrect = false;
            }
        });

        if (allCorrect && Object.keys(dragAnswers).length === correctPairs.length) {
            playSound('correct');
            score += 25;
            document.getElementById('score-display').textContent = `⭐ ماركه: ${score}`;
        } else {
            playSound('wrong');
        }

        setTimeout(() => {
            currentQuestionIndex++;
            if (currentQuestionIndex < activeQuestions.length) loadQuestion();
            else showEndScreen();
        }, 1300);
    }

    function showEndScreen() {
        document.getElementById('quiz-screen').style.display = 'none';
        document.getElementById('end-screen').style.display = 'flex';
        document.getElementById('final-score').textContent = `جومله ماركه ياسمين: ${score} / 100 ⭐`;
        triggerConfetti();
    }

    function triggerConfetti() {
        const canvas = document.getElementById('confetti-canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = canvas.parentElement.clientWidth;
        canvas.height = canvas.parentElement.clientHeight;

        const pieces = Array.from({ length: 70 }, () => ({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height - canvas.height,
            color: ['#ff4757', '#ffa502', '#2ed573', '#1e90ff', '#8e44ad'][Math.floor(Math.random() * 5)],
            size: Math.random() * 8 + 5,
            speed: Math.random() * 4 + 3
        }));

        let frame = 0;
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            pieces.forEach(p => {
                ctx.fillStyle = p.color;
                ctx.fillRect(p.x, p.y, p.size, p.size);
                p.y += p.speed;
            });
            frame++;
            if (frame < 60) requestAnimationFrame(draw);
            else ctx.clearRect(0, 0, canvas.width, canvas.height);
        }
        draw();
    }

    startGame();
</script>

</body>
</html>
